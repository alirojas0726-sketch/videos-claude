<style>
/* Layout: una columna; el tablero blanco con el mini profe arriba, debajo los controles y el texto de lo que explica. */

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){

:root[data-theme="dark"]{
  --bg:#141a22; --panel:#1d2530; --fg:#e8edf3; --muted:#9fb0c2; --line:#334050;

.derecha{display:flex; gap:14px; align-items:baseline; flex-wrap:wrap}

.tablero{position:relative}

.btn.grande{font-size:1.2rem; padding:14px 26px}

<script>
const $ = id => document.getElementById(id);
const BLUE="#1f5fbf", GREEN="#1d8a4e", RED="#c62f2f", DARK="#1d2733", GREY="#6b7785", ORANGE="#c36a12";
const F_AZ="rgba(31,95,191,.14)", F_VE="rgba(29,138,78,.16)", F_NA="rgba(214,130,30,.18)", F_RO="rgba(198,47,47,.10)";
/* Piezas comunes de las láminas: texto, trazo, ecuación con fracción y plano cartesiano */
const T = (text, x, y, size, color) => ({text, x, y, size, color:color || DARK});
const PA = (path, color, w, fill) => ({path, color, w, fill});
const EQ = (eq, x, y, size, color) => ({eq, x, y, size, color:color || DARK});
const menos = n => String(n).replace("-", "−");
/* Plano: o = {ox, oy, u, x0, x1, y0, y1}. Devuelve la cuadrícula, los ejes y los números (van en "base": aparecen de una). */
function plano(o){
  const {ox, oy, u, x0, x1, y0, y1} = o, X = x => ox + x * u, Y = y => oy - y * u, out = [];
  let g = "";
  for (let x = x0; x <= x1; x++) g += `M${X(x)} ${Y(y1)} L${X(x)} ${Y(y0)} `;
  for (let y = y0; y <= y1; y++) g += `M${X(x0)} ${Y(y)} L${X(x1)} ${Y(y)} `;
  out.push(PA(g, "#d3dbe5", 1.5));
  const xa = X(x1) + 26, ya = Y(y1) - 26;
  out.push(PA(`M${X(x0) - 14} ${oy} L${xa} ${oy} M${xa} ${oy} l-14 -8 M${xa} ${oy} l-14 8 M${ox} ${Y(y0) + 14} L${ox} ${ya} M${ox} ${ya} l-8 14 M${ox} ${ya} l8 14`, DARK, 3));
  for (let x = x0; x <= x1; x++) if (x) out.push(T(menos(x), X(x) - (x < 0 ? 12 : 5), oy + 24, 19, GREY));
  for (let y = y0; y <= y1; y++) if (y) out.push(T(menos(y), ox - (y < 0 ? 32 : 22), Y(y) + 7, 19, GREY));
  out.push(T("0", ox - 20, oy + 24, 19, GREY), T("x", xa - 4, oy - 14, 28), T("y", ox + 14, ya + 8, 28));
  return out;
}
const PX = (o, x) => o.ox + x * o.u, PY = (o, y) => o.oy - y * o.u;
function punto(o, x, y, color, r){ r = r || 8; const cx = PX(o, x), cy = PY(o, y);
  return PA(`M${cx - r} ${cy} a${r} ${r} 0 1 0 ${2 * r} 0 a${r} ${r} 0 1 0 ${-2 * r} 0`, color, 3, color); }
/* Curva y = f(x) entre xa y xb; con flechas en las puntas si "flechas" */
function curva(o, f, xa, xb, color, w, flechas){
  const n = 60, pts = [];
  for (let i = 0; i <= n; i++){ const x = xa + (xb - xa) * i / n; pts.push([PX(o, x), PY(o, f(x))]); }
  let d = "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
  if (flechas){
    const cab = (a, b) => { const ang = Math.atan2(a[1] - b[1], a[0] - b[0]), L = 18;
      return [0.45, -0.45].map(s => `M${a[0].toFixed(1)} ${a[1].toFixed(1)} l${(-L * Math.cos(ang + s)).toFixed(1)} ${(-L * Math.sin(ang + s)).toFixed(1)}`).join(" "); };
    d += " " + cab(pts[n], pts[n - 1]) + " " + cab(pts[0], pts[1]);
  }
  return PA(d, color, w || 5);
}
/* Línea punteada entre dos puntos del plano */
function punteada(o, xa, ya, xb, yb, color){
  const A = [PX(o, xa), PY(o, ya)], B = [PX(o, xb), PY(o, yb)], L = Math.hypot(B[0] - A[0], B[1] - A[1]), n = Math.max(1, Math.floor(L / 22));
  let d = ""; for (let i = 0; i < n; i++){ const t0 = i / n, t1 = Math.min(1, (i + .55) / n);
    d += `M${(A[0] + (B[0] - A[0]) * t0).toFixed(1)} ${(A[1] + (B[1] - A[1]) * t0).toFixed(1)} L${(A[0] + (B[0] - A[0]) * t1).toFixed(1)} ${(A[1] + (B[1] - A[1]) * t1).toFixed(1)} `; }
  return PA(d, color || GREY, 3);
}

// TITULO: Suma y resta de polinomios
const LAMINAS = [
  { pag:"Inicio", titulo:"Suma y resta de polinomios", items:[
      T("Nivelación · Matemáticas 8°", 120, 250, 44, BLUE),
      T("(3x² + 2x − 5) + (x² − 6x + 4)", 120, 380, 48),
      T("(5x² − 3x + 2) − (2x² + 4x − 6)", 120, 470, 48),
      T("Términos semejantes · signos en la resta", 120, 600, 36, GREY)],
    say:"¡Hola, muchachos! Soy el profe Alirio. En esta clase de nivelación vamos a repasar la suma y la resta de polinomios. Tengan listo el cuaderno para copiar cada lámina." },

  { pag:"Lámina 1 de 7", titulo:"Lámina 1 · Términos semejantes", items:[
      T("Semejantes: misma letra y mismo exponente", 100, 210, 42, BLUE),
      T("3x²  y  −5x²   →  SÍ son semejantes", 140, 320, 44, GREEN),
      T("3x²  y  3x   →  NO son semejantes", 140, 420, 44, RED),
      T("(los exponentes son distintos: 2 y 1)", 180, 480, 32, GREY),
      T("Solo los semejantes se suman o se restan", 100, 610, 42)],
    say:"Lámina uno. Dos términos son semejantes cuando tienen la misma letra elevada al mismo exponente. Solo los términos semejantes se pueden sumar o restar entre sí. Tres equis al cuadrado y menos cinco equis al cuadrado sí son semejantes; tres equis al cuadrado y tres equis no, porque el exponente es distinto." },

  { pag:"Lámina 2 de 7", titulo:"Lámina 2 · Reducir términos semejantes", items:[
      T("Se operan los números (coeficientes)", 100, 210, 40),
      T("y la parte de la letra queda igual", 100, 265, 40),
      T("4x + 7x = 11x", 160, 400, 54, BLUE), T("(4 + 7 = 11)", 640, 400, 34, GREY),
      T("5a² − 8a² = −3a²", 160, 520, 54, BLUE), T("(5 − 8 = −3)", 640, 520, 34, GREY)],
    say:"Lámina dos. Para reducir, se suman o restan los coeficientes, que son los números, y la parte de la letra se deja igual. Cuatro equis más siete equis, once equis. Cinco a al cuadrado menos ocho a al cuadrado, menos tres a al cuadrado." },

  { pag:"Lámina 3 de 7", titulo:"Lámina 3 · Suma de polinomios", items:[
      T("(3x² + 2x − 5) + (x² − 6x + 4)", 100, 210, 48),
      T("x²:   3 + 1 = 4   →   4x²", 140, 320, 40, BLUE),
      T("x:   2 − 6 = −4   →   −4x", 140, 395, 40, GREEN),
      T("números:   −5 + 4 = −1", 140, 470, 40, ORANGE),
      T("= 4x² − 4x − 1", 100, 600, 56, RED)],
    say:"Lámina tres. Para sumar polinomios, se quitan los paréntesis y se juntan los términos semejantes. Equis al cuadrado con equis al cuadrado: tres más uno, cuatro equis al cuadrado. Las equis: dos menos seis, menos cuatro equis. Los números: menos cinco más cuatro, menos uno. El resultado es cuatro equis al cuadrado, menos cuatro equis, menos uno." },

  { pag:"Lámina 4 de 7", titulo:"Lámina 4 · Suma en columnas", items:[
      T("(2a³ − a + 7) + (a³ + 4a² − 3)", 100, 200, 40),
      T("2a³", 260, 290, 50), T("− a", 600, 290, 50), T("+ 7", 760, 290, 50),
      T("+", 180, 370, 50), T("a³", 275, 370, 50), T("+ 4a²", 420, 370, 50), T("− 3", 760, 370, 50),
      PA("M170 405 L880 405", DARK, 4),
      T("3a³", 260, 475, 50, RED), T("+ 4a²", 420, 475, 50, RED), T("− a", 600, 475, 50, RED), T("+ 4", 760, 475, 50, RED),
      T("Ordenar de mayor a menor exponente", 100, 600, 36, BLUE),
      T("y poner los semejantes uno debajo del otro.", 100, 650, 36, BLUE),
      T("Si falta un término, se deja el espacio (aquí el a²).", 100, 720, 32, GREY)],
    say:"Lámina cuatro. También se puede sumar en columnas, como con los números. Se ordenan de mayor a menor exponente y se ponen los semejantes uno debajo del otro. Si falta un término, se deja el espacio: al primero le falta el a al cuadrado. El resultado: tres a al cubo, más cuatro a al cuadrado, menos a, más cuatro." },

  { pag:"Lámina 5 de 7", titulo:"Lámina 5 · Resta de polinomios", items:[
      T("(5x² − 3x + 2) − (2x² + 4x − 6)", 100, 210, 46),
      T("El − de afuera cambia TODOS los signos del segundo", 100, 290, 34, RED),
      T("= 5x² − 3x + 2 − 2x² − 4x + 6", 100, 390, 46),
      T("x²:  5 − 2 = 3     x:  −3 − 4 = −7     números:  2 + 6 = 8", 100, 475, 30, GREY),
      T("= 3x² − 7x + 8", 100, 590, 56, RED)],
    say:"Lámina cinco. En la resta está el error más común. El signo menos delante del paréntesis cambia el signo de todos los términos del polinomio que se resta. Más dos equis al cuadrado pasa a menos; más cuatro equis pasa a menos; menos seis pasa a más. Después se reduce como en la suma: tres equis al cuadrado, menos siete equis, más ocho." },

  { pag:"Lámina 6 de 7", titulo:"Lámina 6 · Otro ejemplo de resta", items:[
      T("(4y³ − 2y + 1) − (y³ − 5y² − 2y + 3)", 100, 210, 44),
      T("= 4y³ − 2y + 1 − y³ + 5y² + 2y − 3", 100, 310, 44),
      T("y³:  4 − 1 = 3        y²:  solo + 5", 140, 400, 34, GREY),
      T("y:  −2 + 2 = 0 (desaparece)      números:  1 − 3 = −2", 140, 455, 34, GREY),
      T("= 3y³ + 5y² − 2", 100, 580, 56, RED)],
    say:"Lámina seis. Otro ejemplo. Cambiamos los signos del segundo: menos ye al cubo, más cinco ye al cuadrado, más dos ye, menos tres. Ye al cubo: cuatro menos uno, tres. Ye al cuadrado: solo hay más cinco. Las ye: menos dos más dos, cero, así que desaparecen. Los números: uno menos tres, menos dos." },

  { pag:"Lámina 7 de 7", titulo:"Lámina 7 · Ahora ustedes", items:[
      T("A = 6m² − 4m + 3", 120, 230, 50),
      T("B = 2m² + m − 7", 120, 310, 50),
      T("Calculen:    a) A + B        b) A − B", 120, 420, 42, BLUE)],
    resp:[
      T("a)  A + B = 8m² − 3m − 4", 120, 540, 44, RED),
      T("b)  A − B = 6m² − 4m + 3 − 2m² − m + 7", 120, 630, 38, GREY),
      T("= 4m² − 5m + 10", 230, 710, 46, RED)],
    say:"Lámina siete. Ahora ustedes. A es igual a seis eme al cuadrado, menos cuatro eme, más tres. B es igual a dos eme al cuadrado, más eme, menos siete. Calculen A más B, y A menos B. Cuando terminen, toquen el botón Ver la respuesta para revisar.",
    sayResp:"Revisemos. A más B: seis más dos, ocho eme al cuadrado; menos cuatro más uno, menos tres eme; tres menos siete, menos cuatro. A menos B: cambiamos los signos de B y queda seis eme al cuadrado, menos cuatro eme, más tres, menos dos eme al cuadrado, menos eme, más siete. Reducimos: cuatro eme al cuadrado, menos cinco eme, más diez. ¿Les dio igual? ¡Muy bien!" }
];
const DUDAS = [
  { q:"¿Por qué no puedo sumar 3x² con 3x?", a:"Porque no son semejantes: el exponente es distinto (2 y 1).",
    say:"Porque no son semejantes: tres equis al cuadrado tiene exponente dos y tres equis tiene exponente uno." },
  { q:"¿Qué pasa con los signos en la resta?", a:"El menos delante del paréntesis le cambia el signo a todos los términos de adentro, no solo al primero." },
  { q:"¿Qué hago si un término da cero?", a:"Ese término desaparece del resultado. Por ejemplo, −2y + 2y = 0.",
    say:"Ese término desaparece del resultado. Por ejemplo, menos dos ye más dos ye da cero." },
  { q:"¿Qué es el coeficiente?", a:"Es el número que acompaña a la letra. En −5x², el coeficiente es −5.",
    say:"Es el número que acompaña a la letra. En menos cinco equis al cuadrado, el coeficiente es menos cinco." },
  { q:"¿Si la letra no tiene número, cuánto vale?", a:"Vale 1. Por ejemplo, x² es lo mismo que 1x², y −m es −1m.",
    say:"Vale uno. Por ejemplo, equis al cuadrado es lo mismo que uno equis al cuadrado, y menos eme es menos uno eme." }
];

/* =================== Tablero y mini profe =================== */
const NS = "http://www.w3.org/2000/svg";
const ink = $("ink"), profeG = $("profe");
const el = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); (p || ink).appendChild(e); return e; };
let nodos = [], dibujoId = 0;
function construir(lam){
  ink.innerHTML = ""; nodos = [];
  const todos = [...(lam.base || []).map(x => ({...x, _base:true})), ...lam.items];
  todos.forEach((it, i) => {
    if (it.path){
      const p = el("path", {d:it.path, fill:it.fill || "none", "fill-opacity":0, stroke:it.color, "stroke-width":it.w, "stroke-linecap":"round", "stroke-linejoin":"round"});
      const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
      nodos.push({it, p, L});
    } else if (it.eq){ // ecuación con fracciones desplegadas, se escribe de izquierda a derecha

const SH = {x:-70, y:494}, L1 = 175, L2 = 165, REPOSO = 1430;
