<script>
const $ = id => document.getElementById(id);
const BLUE="#1f5fbf", GREEN="#1d8a4e", RED="#c62f2f", DARK="#1d2733", GREY="#6b7785", ORANGE="#c36a12";
const F_AZ="rgba(31,95,191,.14)", F_VE="rgba(29,138,78,.16)", F_NA="rgba(214,130,30,.18)", F_RO="rgba(198,47,47,.10)";
/* Piezas comunes de las láminas: texto, trazo, ecuación con fracción y plano cartesiano */
const T = (text, x, y, size, color) => ({text, x, y, size, color:color || DARK});
const PA = (path, color, w, fill) => ({path, color, w, fill});
const EQ = (eq, x, y, size, color) => ({eq, x, y, size, color:color || DARK});
const menos = n => String(n).replace("-", "−");
/* Plano: o = {ox, oy, u, x0, x1, y0, y1}. Devuelve la cuadrícula, los ejes y los números (van en "base": aparecen de una). */
function plano(o){
  const {ox, oy, u, x0, x1, y0, y1} = o, X = x => ox + x * u, Y = y => oy - y * u, out = [];
  let g = "";
  for (let x = x0; x <= x1; x++) g += `M${X(x)} ${Y(y1)} L${X(x)} ${Y(y0)} `;
  for (let y = y0; y <= y1; y++) g += `M${X(x0)} ${Y(y)} L${X(x1)} ${Y(y)} `;
  out.push(PA(g, "#d3dbe5", 1.5));
  const xa = X(x1) + 26, ya = Y(y1) - 26;
  out.push(PA(`M${X(x0) - 14} ${oy} L${xa} ${oy} M${xa} ${oy} l-14 -8 M${xa} ${oy} l-14 8 M${ox} ${Y(y0) + 14} L${ox} ${ya} M${ox} ${ya} l-8 14 M${ox} ${ya} l8 14`, DARK, 3));
  for (let x = x0; x <= x1; x++) if (x) out.push(T(menos(x), X(x) - (x < 0 ? 12 : 5), oy + 24, 19, GREY));
  for (let y = y0; y <= y1; y++) if (y) out.push(T(menos(y), ox - (y < 0 ? 32 : 22), Y(y) + 7, 19, GREY));
  out.push(T("0", ox - 20, oy + 24, 19, GREY), T("x", xa - 4, oy - 14, 28), T("y", ox + 14, ya + 8, 28));
  return out;
}
const PX = (o, x) => o.ox + x * o.u, PY = (o, y) => o.oy - y * o.u;
function punto(o, x, y, color, r){ r = r || 8; const cx = PX(o, x), cy = PY(o, y);
  return PA(`M${cx - r} ${cy} a${r} ${r} 0 1 0 ${2 * r} 0 a${r} ${r} 0 1 0 ${-2 * r} 0`, color, 3, color); }
/* Curva y = f(x) entre xa y xb; con flechas en las puntas si "flechas" */
function curva(o, f, xa, xb, color, w, flechas){
  const n = 60, pts = [];
  for (let i = 0; i <= n; i++){ const x = xa + (xb - xa) * i / n; pts.push([PX(o, x), PY(o, f(x))]); }
  let d = "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
  if (flechas){
    const cab = (a, b) => { const ang = Math.atan2(a[1] - b[1], a[0] - b[0]), L = 18;
      return [0.45, -0.45].map(s => `M${a[0].toFixed(1)} ${a[1].toFixed(1)} l${(-L * Math.cos(ang + s)).toFixed(1)} ${(-L * Math.sin(ang + s)).toFixed(1)}`).join(" "); };
    d += " " + cab(pts[n], pts[n - 1]) + " " + cab(pts[0], pts[1]);
  }
  return PA(d, color, w || 5);
}
/* Línea punteada entre dos puntos del plano */
function punteada(o, xa, ya, xb, yb, color){
  const A = [PX(o, xa), PY(o, ya)], B = [PX(o, xb), PY(o, yb)], L = Math.hypot(B[0] - A[0], B[1] - A[1]), n = Math.max(1, Math.floor(L / 22));
  let d = ""; for (let i = 0; i < n; i++){ const t0 = i / n, t1 = Math.min(1, (i + .55) / n);
    d += `M${(A[0] + (B[0] - A[0]) * t0).toFixed(1)} ${(A[1] + (B[1] - A[1]) * t0).toFixed(1)} L${(A[0] + (B[0] - A[0]) * t1).toFixed(1)} ${(A[1] + (B[1] - A[1]) * t1).toFixed(1)} `; }
  return PA(d, color || GREY, 3);
}

// TITULO: Ecuaciones lineales con edades
const LAMINAS = [
  { pag:"Inicio", titulo:"Ecuaciones lineales con edades", items:[
      T("Nivelación · Matemáticas 8°", 120, 250, 44, BLUE),
      T("«El triple de la edad de Juan, menos 4, es 38»", 120, 380, 40),
      T("3x − 4 = 38", 120, 470, 52, RED),
      T("Del problema a la ecuación, y a la respuesta", 120, 600, 36, GREY)],
    say:"¡Hola, muchachos! Soy el profe Alirio. En esta clase de nivelación vamos a resolver problemas de edades con ecuaciones lineales: pasar el problema a una ecuación, resolverla y comprobar. Tengan listo el cuaderno." },

  { pag:"Lámina 1 de 7", titulo:"Lámina 1 · Repaso: resolver una ecuación", items:[
      T("3x + 5 = 20", 120, 215, 52),
      T("3x = 20 − 5", 120, 300, 46), T("el + 5 pasa a restar", 560, 300, 30, GREY),
      T("3x = 15", 120, 380, 46),
      EQ(["x = ", {n:"15", d:"3"}], 120, 480, 46), T("el 3 que multiplica pasa a dividir", 560, 480, 30, GREY),
      T("x = 5", 120, 600, 56, RED),
      T("Comprobación:  3 · 5 + 5 = 20  ✓", 120, 690, 40, GREEN)],
    say:"Lámina uno. Repaso. Resolver una ecuación es encontrar el valor de la equis. Tres equis más cinco igual a veinte. El cinco que está sumando pasa al otro lado a restar: veinte menos cinco, quince. El tres que está multiplicando pasa a dividir: quince entre tres, cinco. Y siempre comprobamos: tres por cinco más cinco da veinte. Sí cumple." },

  { pag:"Lámina 2 de 7", titulo:"Lámina 2 · Las edades en lenguaje algebraico", items:[
      T("Edad de hoy:", 120, 205, 40), T("x", 640, 205, 46, RED),
      T("Hace 5 años:", 120, 275, 40), T("x − 5", 640, 275, 46, RED),
      T("Dentro de 8 años:", 120, 345, 40), T("x + 8", 640, 345, 46, RED),
      T("El doble:", 120, 415, 40), T("2x", 640, 415, 46, RED),
      T("El triple:", 120, 485, 40), T("3x", 640, 485, 46, RED),
      T("La mitad:", 120, 575, 40), EQ([{n:"x", d:"2"}], 625, 575, 46, RED),
      T("3 años mayor:", 120, 665, 40), T("x + 3", 640, 665, 46, RED),
      T("3 años menor:", 120, 735, 40), T("x − 3", 640, 735, 46, RED)],
    say:"Lámina dos. Las edades en lenguaje algebraico. Si la edad de hoy es equis, hace cinco años tenía equis menos cinco, porque era más joven. Dentro de ocho años tendrá equis más ocho. El doble es dos equis, el triple es tres equis y la mitad es equis sobre dos. Ser tres años mayor es sumar tres; ser tres años menor es restar tres." },

  { pag:"Lámina 3 de 7", titulo:"Lámina 3 · Ejemplo 1: una sola persona", items:[
      T("«El triple de la edad de Juan, menos 4, es 38»", 100, 205, 38, BLUE),
      T("Edad de Juan:  x", 120, 285, 40),
      T("3x − 4 = 38", 120, 370, 48),
      T("3x = 38 + 4 = 42", 120, 450, 48),
      EQ(["x = ", {n:"42", d:"3"}, " = 14"], 120, 550, 48),
      T("Juan tiene 14 años", 120, 660, 50, RED),
      T("Comprobación:  3 · 14 − 4 = 38  ✓", 120, 740, 36, GREEN)],
    say:"Lámina tres. Primer ejemplo: el triple de la edad de Juan, menos cuatro, es treinta y ocho. Llamamos equis a la edad de Juan. El triple es tres equis, menos cuatro, es igual a treinta y ocho. El cuatro pasa a sumar: cuarenta y dos. El tres pasa a dividir: catorce. Juan tiene catorce años. Comprobamos: tres por catorce, cuarenta y dos, menos cuatro, treinta y ocho." },

  { pag:"Lámina 4 de 7", titulo:"Lámina 4 · Ejemplo 2: dos personas", items:[
      T("«Pedro tiene 6 años más que Luis.", 100, 200, 38, BLUE),
      T("Entre los dos suman 40»", 120, 250, 38, BLUE),
      T("Luis:  x          Pedro:  x + 6", 120, 330, 42),
      T("x + (x + 6) = 40", 120, 410, 46),
      T("2x + 6 = 40   →   2x = 34", 120, 490, 46),
      EQ(["x = ", {n:"34", d:"2"}, " = 17"], 120, 585, 46),
      T("Luis: 17 años     Pedro: 23 años", 120, 690, 46, RED),
      T("17 + 23 = 40  ✓", 120, 760, 36, GREEN)],
    say:"Lámina cuatro. Segundo ejemplo: Pedro tiene seis años más que Luis, y entre los dos suman cuarenta. Cuando hay dos personas, a la menor la llamamos equis y a la otra la escribimos usando equis. Luis es equis y Pedro es equis más seis. Sumamos las dos edades y las igualamos a cuarenta: dos equis más seis igual a cuarenta, dos equis igual a treinta y cuatro, equis igual a diecisiete. Al final damos las dos respuestas: Luis diecisiete y Pedro veintitrés." },

  { pag:"Lámina 5 de 7", titulo:"Lámina 5 · Ejemplo 3: con el futuro", items:[
      T("«Un padre tiene 35 años y su hijo 5. ¿Dentro de cuántos años", 100, 195, 31, BLUE),
      T("la edad del padre será el triple de la del hijo?»", 100, 240, 31, BLUE),
      PA("M100 345 L740 345 M100 415 L740 415 M260 290 L260 480 M410 290 L410 480", GREY, 2),
      T("Hoy", 300, 325, 32, GREY), T("Dentro de x años", 425, 325, 30, GREY),
      T("Padre", 115, 395, 38), T("35", 310, 395, 40), T("35 + x", 450, 395, 40, BLUE),
      T("Hijo", 115, 465, 38), T("5", 325, 465, 40), T("5 + x", 455, 465, 40, BLUE),
      T("35 + x = 3(5 + x)", 800, 340, 40),
      T("35 + x = 15 + 3x", 800, 410, 40),
      T("35 − 15 = 3x − x", 800, 480, 40),
      T("20 = 2x   →   x = 10", 800, 550, 40, RED),
      T("Dentro de 10 años: padre 45, hijo 15", 100, 650, 42, RED),
      T("3 · 15 = 45  ✓", 100, 730, 36, GREEN)],
    say:"Lámina cinco. Tercer ejemplo: un padre tiene treinta y cinco años y su hijo cinco. ¿Dentro de cuántos años la edad del padre será el triple de la del hijo? Aquí la equis no es una edad: son los años que pasan. Hacemos una tabla con hoy y dentro de equis años. Al padre y al hijo se les suma la misma equis, porque el tiempo pasa igual para los dos. Planteamos: la edad del padre es igual a tres veces la del hijo. Ojo con el paréntesis: el tres multiplica al cinco y a la equis. Resolvemos y da diez años. Dentro de diez años el padre tendrá cuarenta y cinco y el hijo quince." },

  { pag:"Lámina 6 de 7", titulo:"Lámina 6 · Los pasos", items:[
      T("1.  Leer bien y decidir qué es x", 120, 225, 42),
      T("2.  Escribir las edades con x", 120, 310, 42),
      T("(si hay pasado o futuro, hacer la tabla)", 180, 365, 32, GREY),
      T("3.  Plantear la ecuación", 120, 450, 42),
      T("4.  Resolver", 120, 535, 42),
      T("5.  Responder la pregunta y comprobar", 120, 620, 42, RED)],
    say:"Lámina seis. Estos son los cinco pasos. Uno: leer bien y decidir qué es equis. Dos: escribir las edades con equis; si hay pasado o futuro, hacer la tabla. Tres: plantear la ecuación. Cuatro: resolver. Cinco: responder la pregunta y comprobar. El más importante es el primero: saber qué es la equis. Y al final no basta con decir equis igual a diez; hay que responder lo que pregunta el problema." },

  { pag:"Lámina 7 de 7", titulo:"Lámina 7 · Ahora ustedes", items:[
      T("«María tiene el doble de la edad de su hermano.", 100, 210, 36, BLUE),
      T("Hace 4 años, la suma de sus edades era 31.", 100, 262, 36, BLUE),
      T("¿Cuántos años tiene cada uno?»", 100, 314, 36, BLUE)],
    resp:[
      T("Hermano:  x          María:  2x", 120, 405, 40),
      T("(x − 4) + (2x − 4) = 31", 120, 480, 42),
      T("3x − 8 = 31   →   3x = 39   →   x = 13", 120, 555, 40),
      T("Hermano: 13 años     María: 26 años", 120, 650, 44, RED),
      T("Hace 4 años: 9 + 22 = 31  ✓", 120, 730, 36, GREEN)],
    say:"Lámina siete. Ahora ustedes. María tiene el doble de la edad de su hermano. Hace cuatro años, la suma de sus edades era treinta y uno. ¿Cuántos años tiene cada uno? Sigan los cinco pasos en el cuaderno y, cuando terminen, toquen el botón Ver la respuesta.",
    sayResp:"Revisemos. El hermano es equis y María es dos equis. Hace cuatro años tenían equis menos cuatro y dos equis menos cuatro, y sumaban treinta y uno. Tres equis menos ocho igual a treinta y uno; tres equis igual a treinta y nueve; equis igual a trece. El hermano tiene trece años y María veintiséis. Comprobamos: hace cuatro años tenían nueve y veintidós, que suman treinta y uno. ¿Les dio igual? ¡Muy bien!" }
];
const DUDAS = [
  { q:"¿A quién le pongo la x?", a:"Por lo general, a la persona de la que menos se sabe o a la menor; las demás se escriben usando x." },
  { q:"¿Por qué hace 4 años se resta a los dos?", a:"Porque el tiempo pasa igual para todos: hace 4 años, cada persona tenía 4 años menos.",
    say:"Porque el tiempo pasa igual para todos: hace cuatro años, cada persona tenía cuatro años menos." },
  { q:"¿Qué hago si la x me da negativa o con decimales?", a:"Revise el planteamiento: una edad no puede ser negativa, y en estos problemas casi siempre da un número entero." },
  { q:"¿Por qué se usa paréntesis en 3(5 + x)?", a:"Porque es el triple de toda la edad futura del hijo, no solo del 5. El 3 multiplica al 5 y a la x.",
    say:"Porque es el triple de toda la edad futura del hijo, no solo del cinco. El tres multiplica al cinco y a la equis." },

const SH = {x:-70, y:494}, L1 = 175, L2 = 165, REPOSO = 1430;
let cx = REPOSO, paso = 0;
function pose(tip, escribiendo){

  const dx = hx - SH.x, dy = hy - SH.y;
  const d = Math.min(Math.max(Math.hypot(dx, dy), Math.abs(L1 - L2) + 2), L1 + L2 - 2);

  set(P.upO, {x1:SH.x, y1:SH.y, x2:ex, y2:ey});

  set(P.hand, {cx:fx, cy:fy}); set(P.thumb, {cx:fx - uy / ul * 12, cy:fy + ux / ul * 12});

const sinMov = matchMedia("(prefers-reduced-motion: reduce)").matches;
function mostrarLamina(k, animar, alTerminar){
  const lam = typeof k === "object" ? k : LAMINAS[k]; const id = ++dibujoId;

/* =================== La clase (cada estudiante a su ritmo) =================== */
let k = 0, vozOn = true, voces = [];
const hayVoz = "speechSynthesis" in window;
/* Voces del celular: se prefiere una voz de hombre en español; el estudiante puede escoger otra en "Voz". */
const HOMBRES = /(raul|raúl|pablo|jorge|diego|juan|carlos|enrique|alvaro|álvaro|gonzalo|andres|andrés|tomas|tomás|jose|josé|miguel|gerardo|jaime|dario|darío|emilio|federico|hugo|alonso|lorenzo|salvador|gabriel|\bmale\b|hombre|masculin)/i;
const MUJERES = /(female|mujer|femenin|paulina|monica|mónica|helena|laura|sabina|elvira|dalia|salome|salomé|paloma|marisol|lucia|lucía|soledad|angelica|angélica|isabel|francisca|ximena|catalina|camila|valentina|esperanza|elena|ines|inés)/i;
let vozElegida = "";
try { vozElegida = localStorage.getItem("niv_voz") || ""; } catch (e) {}
function puntos(v){ const l = v.lang.replace("_", "-"); let p = 0;
  if (HOMBRES.test(v.name)) p += 100; if (MUJERES.test(v.name)) p -= 100;
  p += {"es-CO":8, "es-MX":7, "es-US":6, "es-419":5, "es-ES":3}[l] || 1; if (/natural|online|neural|enhanced|premium/i.test(v.name)) p += 2; return p; }
function cargarVoces(){
  try { voces = speechSynthesis.getVoices().filter(v => /^es/i.test(v.lang)).sort((x, y) => puntos(y) - puntos(x)); } catch (e) { voces = []; }
  const sel = $("elegirVoz"); if (!sel) return;
  sel.innerHTML = voces.map(v => `<option value="${v.name.replace(/"/g, "&quot;")}">${v.name.replace(/</g, "&lt;")}${HOMBRES.test(v.name) ? " (hombre)" : ""}</option>`).join("");
  if (vozElegida && voces.some(v => v.name === vozElegida)) sel.value = vozElegida;
  $("cajaVoz").hidden = voces.length < 2;
}
function vozEs(){ return voces.find(v => v.name === vozElegida) || voces[0] || null; }

function hablar(texto){
