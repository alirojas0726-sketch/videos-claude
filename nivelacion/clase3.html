<style>
/* Layout: una columna; el tablero blanco con el mini profe arriba, debajo los controles y el texto de lo que explica. */
:root{

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141a22; --panel:#1d2530; --fg:#e8edf3; --muted:#9fb0c2; --line:#334050;
  --azul:#5b9bf0; --azul-fg:#0d1622; --rojo:#ef7070; --verde:#4cc287; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141a22; --panel:#1d2530; --fg:#e8edf3; --muted:#9fb0c2; --line:#334050;

body{background:var(--bg); color:var(--fg); font-family:var(--font-ui); font-size:16px;

.derecha{display:flex; gap:14px; align-items:baseline; flex-wrap:wrap}
.volver{color:var(--azul); font-weight:700; text-decoration:none}

.pag{color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums}
.tablero{position:relative}
#ink text{white-space:pre}

.btn{font:inherit; font-weight:800; border-radius:10px; padding:10px 16px; cursor:pointer; border:1px solid var(--line); background:var(--panel); color:var(--fg)}

<script>
const $ = id => document.getElementById(id);
const BLUE="#1f5fbf", GREEN="#1d8a4e", RED="#c62f2f", DARK="#1d2733", GREY="#6b7785", ORANGE="#c36a12";
const F_AZ="rgba(31,95,191,.14)", F_VE="rgba(29,138,78,.16)", F_NA="rgba(214,130,30,.18)", F_RO="rgba(198,47,47,.10)";
/* Piezas comunes de las láminas: texto, trazo, ecuación con fracción y plano cartesiano */
const T = (text, x, y, size, color) => ({text, x, y, size, color:color || DARK});
const PA = (path, color, w, fill) => ({path, color, w, fill});
const EQ = (eq, x, y, size, color) => ({eq, x, y, size, color:color || DARK});
const menos = n => String(n).replace("-", "−");
/* Plano: o = {ox, oy, u, x0, x1, y0, y1}. Devuelve la cuadrícula, los ejes y los números (van en "base": aparecen de una). */
function plano(o){
  const {ox, oy, u, x0, x1, y0, y1} = o, X = x => ox + x * u, Y = y => oy - y * u, out = [];
  let g = "";
  for (let x = x0; x <= x1; x++) g += `M${X(x)} ${Y(y1)} L${X(x)} ${Y(y0)} `;
  for (let y = y0; y <= y1; y++) g += `M${X(x0)} ${Y(y)} L${X(x1)} ${Y(y)} `;
  out.push(PA(g, "#d3dbe5", 1.5));
  const xa = X(x1) + 26, ya = Y(y1) - 26;
  out.push(PA(`M${X(x0) - 14} ${oy} L${xa} ${oy} M${xa} ${oy} l-14 -8 M${xa} ${oy} l-14 8 M${ox} ${Y(y0) + 14} L${ox} ${ya} M${ox} ${ya} l-8 14 M${ox} ${ya} l8 14`, DARK, 3));
  for (let x = x0; x <= x1; x++) if (x) out.push(T(menos(x), X(x) - (x < 0 ? 12 : 5), oy + 24, 19, GREY));
  for (let y = y0; y <= y1; y++) if (y) out.push(T(menos(y), ox - (y < 0 ? 32 : 22), Y(y) + 7, 19, GREY));
  out.push(T("0", ox - 20, oy + 24, 19, GREY), T("x", xa - 4, oy - 14, 28), T("y", ox + 14, ya + 8, 28));
  return out;
}
const PX = (o, x) => o.ox + x * o.u, PY = (o, y) => o.oy - y * o.u;
function punto(o, x, y, color, r){ r = r || 8; const cx = PX(o, x), cy = PY(o, y);
  return PA(`M${cx - r} ${cy} a${r} ${r} 0 1 0 ${2 * r} 0 a${r} ${r} 0 1 0 ${-2 * r} 0`, color, 3, color); }
/* Curva y = f(x) entre xa y xb; con flechas en las puntas si "flechas" */
function curva(o, f, xa, xb, color, w, flechas){
  const n = 60, pts = [];
  for (let i = 0; i <= n; i++){ const x = xa + (xb - xa) * i / n; pts.push([PX(o, x), PY(o, f(x))]); }
  let d = "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
  if (flechas){
    const cab = (a, b) => { const ang = Math.atan2(a[1] - b[1], a[0] - b[0]), L = 18;
      return [0.45, -0.45].map(s => `M${a[0].toFixed(1)} ${a[1].toFixed(1)} l${(-L * Math.cos(ang + s)).toFixed(1)} ${(-L * Math.sin(ang + s)).toFixed(1)}`).join(" "); };
    d += " " + cab(pts[n], pts[n - 1]) + " " + cab(pts[0], pts[1]);
  }
  return PA(d, color, w || 5);
}
/* Línea punteada entre dos puntos del plano */
function punteada(o, xa, ya, xb, yb, color){
  const A = [PX(o, xa), PY(o, ya)], B = [PX(o, xb), PY(o, yb)], L = Math.hypot(B[0] - A[0], B[1] - A[1]), n = Math.max(1, Math.floor(L / 22));
  let d = ""; for (let i = 0; i < n; i++){ const t0 = i / n, t1 = Math.min(1, (i + .55) / n);
    d += `M${(A[0] + (B[0] - A[0]) * t0).toFixed(1)} ${(A[1] + (B[1] - A[1]) * t0).toFixed(1)} L${(A[0] + (B[0] - A[0]) * t1).toFixed(1)} ${(A[1] + (B[1] - A[1]) * t1).toFixed(1)} `; }
  return PA(d, color || GREY, 3);
}

// TITULO: División de polinomios
const LAMINAS = [
  { pag:"Inicio", titulo:"División de polinomios", items:[
      T("Nivelación · Matemáticas 8°", 120, 250, 44, BLUE),
      T("Polinomio entre monomio", 120, 380, 46),
      T("Polinomio entre binomio (en la galera)", 120, 460, 46),
      T("Ley de los signos · los exponentes se restan", 120, 580, 36, GREY)],
    say:"¡Hola, muchachos! Soy el profe Alirio. En esta clase de nivelación vamos a repasar la división de polinomios: polinomio entre monomio y polinomio entre binomio, en la galera. Tengan listo el cuaderno." },

  { pag:"Lámina 1 de 6", titulo:"Lámina 1 · Las dos leyes en la división", items:[
      T("Ley de los signos: igual que al multiplicar", 100, 200, 40, BLUE),
      T("iguales dan +          diferentes dan −", 140, 270, 40),
      T("Ley de los exponentes: se RESTAN", 100, 390, 40, BLUE),
      EQ([{n:"xᵐ", d:"xⁿ"}, " = xᵐ⁻ⁿ"], 140, 500, 48),
      EQ([{n:"x⁵", d:"x²"}, " = x³"], 140, 660, 54, RED)],
    say:"Lámina uno. La ley de los signos es la misma de la multiplicación: signos iguales dan más y signos diferentes dan menos. Lo que cambia es la ley de los exponentes: al dividir letras iguales, los exponentes se restan. Equis a la quinta entre equis al cuadrado es equis al cubo." },

  { pag:"Lámina 2 de 6", titulo:"Lámina 2 · Monomio entre monomio", items:[
      EQ([{n:"12x⁵", d:"3x²"}, " = 4x³"], 120, 270, 54, RED),
      T("12 ÷ 3 = 4        x⁵ ÷ x² = x³", 140, 380, 32, GREY),
      EQ([{n:"−18a⁴b²", d:"6ab"}, " = −3a³b"], 120, 540, 54, RED),
      T("− entre + = −      18 ÷ 6 = 3      a⁴ ÷ a = a³      b² ÷ b = b", 140, 650, 30, GREY)],
    say:"Lámina dos. Se dividen los signos, luego los números y luego las letras, restando exponentes. Doce entre tres, cuatro; equis a la quinta entre equis al cuadrado, equis al cubo. En el segundo: menos entre más, menos; dieciocho entre seis, tres; a a la cuarta entre a, a al cubo; be al cuadrado entre be, be." },

  { pag:"Lámina 3 de 6", titulo:"Lámina 3 · Polinomio entre monomio", items:[
      EQ([{n:"12x⁴ − 8x³ + 4x²", d:"4x²"}], 120, 250, 48),
      T("El monomio divide a cada término:", 120, 360, 34, GREY),
      EQ(["= ", {n:"12x⁴", d:"4x²"}, " − ", {n:"8x³", d:"4x²"}, " + ", {n:"4x²", d:"4x²"}], 120, 470, 46),
      T("= 3x² − 2x + 1", 120, 640, 56, RED),
      T("(4x² ÷ 4x² = 1)", 560, 640, 32, GREY)],
    say:"Lámina tres. El monomio divide a cada término del polinomio. Doce equis a la cuarta entre cuatro equis al cuadrado, tres equis al cuadrado. Menos ocho equis al cubo entre cuatro equis al cuadrado, menos dos equis. Cuatro equis al cuadrado entre cuatro equis al cuadrado, uno." },

  { pag:"Lámina 4 de 6", titulo:"Lámina 4 · Polinomio entre binomio", items:[
      T("x²", 160, 240, 46), T("+ 5x", 270, 240, 46), T("+ 6", 420, 240, 46),
      PA("M540 195 L540 268 L760 268", DARK, 4), T("x + 2", 570, 240, 46),
      T("1) Dividir:  x² ÷ x = x", 820, 230, 30, BLUE),
      T("x + 3", 570, 320, 46, RED),
      T("2) Multiplicar:  x · (x + 2) = x² + 2x", 820, 285, 28, BLUE),
      T("−x²", 140, 310, 46), T("− 2x", 270, 310, 46),
      PA("M135 335 L390 335", DARK, 3),
      T("3) Restar (cambiando los signos)", 820, 340, 28, BLUE),
      T("3x", 290, 395, 46), T("+ 6", 420, 395, 46),
      T("4) Bajar el 6 y repetir", 820, 395, 28, BLUE),
      T("−3x", 265, 465, 46), T("− 6", 420, 465, 46),
      PA("M260 490 L520 490", DARK, 3),
      T("0", 445, 555, 46, RED),
      T("Cociente:  x + 3", 820, 520, 40, RED),
      T("Residuo:  0", 820, 590, 40, RED)],
    say:"Lámina cuatro. Equis al cuadrado más cinco equis más seis, entre equis más dos. Se hace en la galera, como la división larga de números. Primero: equis al cuadrado entre equis, equis. Segundo: equis por equis más dos, equis al cuadrado más dos equis. Tercero: se resta, cambiando los signos, y queda tres equis. Cuarto: se baja el seis y se repite. Tres equis entre equis, tres; tres por equis más dos, tres equis más seis; al restar queda cero. El cociente es equis más tres y el residuo es cero." },

  { pag:"Lámina 5 de 6", titulo:"Lámina 5 · Residuo y comprobación", items:[
      T("(x² + 4x + 7) ÷ (x + 1)", 120, 210, 48),
      T("Cociente:  x + 3          Residuo:  4", 120, 295, 42, RED),
      T("Comprobación:", 120, 410, 42, BLUE),
      T("dividendo = divisor × cociente + residuo", 120, 470, 36, GREY),
      T("(x + 1)(x + 3) + 4", 160, 560, 46),
      T("= x² + 4x + 3 + 4 = x² + 4x + 7 ✓", 160, 640, 46, GREEN)],
    say:"Lámina cinco. A veces la división no da exacta y sobra un residuo. Al dividir equis al cuadrado más cuatro equis más siete entre equis más uno, el cociente es equis más tres y sobran cuatro. Para comprobar, se usa la regla: dividendo igual a divisor por cociente, más residuo. Equis más uno por equis más tres da equis al cuadrado más cuatro equis más tres; más el residuo cuatro, da el dividendo. Está bien." },

  { pag:"Lámina 6 de 6", titulo:"Lámina 6 · Ahora ustedes", items:[
      T("Dividan:", 120, 210, 42, BLUE),
      T("a)  (15a³ − 10a² + 5a) ÷ 5a", 140, 300, 48),
      T("b)  (x² + 7x + 12) ÷ (x + 3)", 140, 390, 48)],
    resp:[
      T("a)  3a² − 2a + 1", 140, 520, 48, RED),
      T("b)  Cociente: x + 4     Residuo: 0", 140, 610, 46, RED),
      T("Comprobación: (x + 3)(x + 4) = x² + 7x + 12 ✓", 140, 700, 36, GREEN)],
    say:"Lámina seis. Ahora ustedes. Primero: quince a al cubo, menos diez a al cuadrado, más cinco a, entre cinco a. Segundo: equis al cuadrado más siete equis más doce, entre equis más tres, en la galera. Cuando terminen, toquen el botón Ver la respuesta.",
    sayResp:"Revisemos. Primero: quince entre cinco, tres a al cuadrado; menos diez entre cinco, menos dos a; cinco a entre cinco a, uno. Queda tres a al cuadrado menos dos a más uno. Segundo: el cociente es equis más cuatro y el residuo es cero. Comprobamos: equis más tres por equis más cuatro da equis al cuadrado más siete equis más doce. ¿Les dio igual? ¡Muy bien!" }
];
const DUDAS = [
  { q:"¿Los exponentes se restan o se dividen?", a:"Se restan: x⁵ ÷ x² = x³.", say:"Se restan. Equis a la quinta entre equis al cuadrado es equis al cubo." },
  { q:"¿Qué pasa si divido x² entre x²?", a:"Da 1, porque todo número (distinto de cero) entre sí mismo es 1.", say:"Da uno, porque todo número entre sí mismo es uno." },
  { q:"¿Por qué al restar en la galera cambio los signos?", a:"Porque se resta todo el producto, igual que en la resta de polinomios: el menos cambia el signo de cada término." },
  { q:"¿Cómo sé si quedó bien?", a:"Con la comprobación: divisor × cociente + residuo debe dar el dividendo.", say:"Con la comprobación: divisor por cociente, más residuo, debe dar el dividendo." },
  { q:"¿Qué hago si al polinomio le falta un término?", a:"Se deja el espacio o se escribe con 0, por ejemplo x² + 0x − 9, para que las columnas queden en orden.",
    say:"Se deja el espacio o se escribe con cero, por ejemplo equis al cuadrado más cero equis menos nueve, para que las columnas queden en orden." }
];

/* =================== Tablero y mini profe =================== */
const NS = "http://www.w3.org/2000/svg";
const ink = $("ink"), profeG = $("profe");
const el = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); (p || ink).appendChild(e); return e; };
let nodos = [], dibujoId = 0;
function construir(lam){
  ink.innerHTML = ""; nodos = [];
  const todos = [...(lam.base || []).map(x => ({...x, _base:true})), ...lam.items];
  todos.forEach((it, i) => {
    if (it.path){
      const p = el("path", {d:it.path, fill:it.fill || "none", "fill-opacity":0, stroke:it.color, "stroke-width":it.w, "stroke-linecap":"round", "stroke-linejoin":"round"});
      const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
      nodos.push({it, p, L});
    } else if (it.eq){ // ecuación con fracciones desplegadas, se escribe de izquierda a derecha
      const cp = el("clipPath", {id:"c" + i});
      const r = el("rect", {x:it.x - 4, y:it.y - it.size * 1.5, width:0, height:it.size * 2.5}, cp);
      const g = el("g", {"clip-path":`url(#c${i})`});
      const at = {"font-family":"Kalam, cursive", fill:it.color};
      let X = it.x;
      it.eq.forEach(sg => {

const SH = {x:-70, y:494}, L1 = 175, L2 = 165, REPOSO = 1430;
