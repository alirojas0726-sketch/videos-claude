<script>
const $ = id => document.getElementById(id);
const BLUE="#1f5fbf", GREEN="#1d8a4e", RED="#c62f2f", DARK="#1d2733", GREY="#6b7785", ORANGE="#c36a12";
const F_AZ="rgba(31,95,191,.14)", F_VE="rgba(29,138,78,.16)", F_NA="rgba(214,130,30,.18)", F_RO="rgba(198,47,47,.10)";
/* Piezas comunes de las láminas: texto, trazo, ecuación con fracción y plano cartesiano */
const T = (text, x, y, size, color) => ({text, x, y, size, color:color || DARK});
const PA = (path, color, w, fill) => ({path, color, w, fill});
const EQ = (eq, x, y, size, color) => ({eq, x, y, size, color:color || DARK});
const menos = n => String(n).replace("-", "−");
/* Plano: o = {ox, oy, u, x0, x1, y0, y1}. Devuelve la cuadrícula, los ejes y los números (van en "base": aparecen de una). */
function plano(o){
  const {ox, oy, u, x0, x1, y0, y1} = o, X = x => ox + x * u, Y = y => oy - y * u, out = [];
  let g = "";
  for (let x = x0; x <= x1; x++) g += `M${X(x)} ${Y(y1)} L${X(x)} ${Y(y0)} `;
  for (let y = y0; y <= y1; y++) g += `M${X(x0)} ${Y(y)} L${X(x1)} ${Y(y)} `;
  out.push(PA(g, "#d3dbe5", 1.5));
  const xa = X(x1) + 26, ya = Y(y1) - 26;
  out.push(PA(`M${X(x0) - 14} ${oy} L${xa} ${oy} M${xa} ${oy} l-14 -8 M${xa} ${oy} l-14 8 M${ox} ${Y(y0) + 14} L${ox} ${ya} M${ox} ${ya} l-8 14 M${ox} ${ya} l8 14`, DARK, 3));
  for (let x = x0; x <= x1; x++) if (x) out.push(T(menos(x), X(x) - (x < 0 ? 12 : 5), oy + 24, 19, GREY));
  for (let y = y0; y <= y1; y++) if (y) out.push(T(menos(y), ox - (y < 0 ? 32 : 22), Y(y) + 7, 19, GREY));
  out.push(T("0", ox - 20, oy + 24, 19, GREY), T("x", xa - 4, oy - 14, 28), T("y", ox + 14, ya + 8, 28));
  return out;
}
const PX = (o, x) => o.ox + x * o.u, PY = (o, y) => o.oy - y * o.u;
function punto(o, x, y, color, r){ r = r || 8; const cx = PX(o, x), cy = PY(o, y);
  return PA(`M${cx - r} ${cy} a${r} ${r} 0 1 0 ${2 * r} 0 a${r} ${r} 0 1 0 ${-2 * r} 0`, color, 3, color); }
/* Curva y = f(x) entre xa y xb; con flechas en las puntas si "flechas" */
function curva(o, f, xa, xb, color, w, flechas){
  const n = 60, pts = [];
  for (let i = 0; i <= n; i++){ const x = xa + (xb - xa) * i / n; pts.push([PX(o, x), PY(o, f(x))]); }
  let d = "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
  if (flechas){
    const cab = (a, b) => { const ang = Math.atan2(a[1] - b[1], a[0] - b[0]), L = 18;
      return [0.45, -0.45].map(s => `M${a[0].toFixed(1)} ${a[1].toFixed(1)} l${(-L * Math.cos(ang + s)).toFixed(1)} ${(-L * Math.sin(ang + s)).toFixed(1)}`).join(" "); };
    d += " " + cab(pts[n], pts[n - 1]) + " " + cab(pts[0], pts[1]);
  }
  return PA(d, color, w || 5);
}
/* Línea punteada entre dos puntos del plano */
function punteada(o, xa, ya, xb, yb, color){
  const A = [PX(o, xa), PY(o, ya)], B = [PX(o, xb), PY(o, yb)], L = Math.hypot(B[0] - A[0], B[1] - A[1]), n = Math.max(1, Math.floor(L / 22));
  let d = ""; for (let i = 0; i < n; i++){ const t0 = i / n, t1 = Math.min(1, (i + .55) / n);
    d += `M${(A[0] + (B[0] - A[0]) * t0).toFixed(1)} ${(A[1] + (B[1] - A[1]) * t0).toFixed(1)} L${(A[0] + (B[0] - A[0]) * t1).toFixed(1)} ${(A[1] + (B[1] - A[1]) * t1).toFixed(1)} `; }
  return PA(d, color || GREY, 3);
}

// TITULO: Operaciones con números enteros
/* Recta numérica de −10 a 10 (cada unidad = 50 px, el 0 en x = 700) */
function rectaNum(y){
  const out = []; let d = `M150 ${y} L1250 ${y} M1250 ${y} l-16 -9 M1250 ${y} l-16 9 M150 ${y} l16 -9 M150 ${y} l16 9 `;
  for (let n = -10; n <= 10; n++) d += `M${700 + n * 50} ${y - 12} L${700 + n * 50} ${y + 12} `;
  out.push(PA(d, DARK, 3));
  for (let n = -10; n <= 10; n += 2) out.push(T(menos(n), 700 + n * 50 - (n < 0 ? 18 : n >= 10 ? 13 : 7), y + 46, 26, n < 0 ? RED : n > 0 ? BLUE : DARK));
  return out;
}
const LAMINAS = [
  { pag:"Inicio", titulo:"Operaciones con números enteros", items:[

  { pag:"Lámina 1 de 7", titulo:"Lámina 1 · Los números enteros", base:rectaNum(330), items:[
      T("← Negativos", 250, 260, 38, RED), T("Positivos →", 960, 260, 38, BLUE),
      T("Positivos: ganancias, temperatura sobre cero, pisos arriba", 100, 480, 32, BLUE),
      T("Negativos: deudas, temperatura bajo cero, sótanos", 100, 540, 32, RED),
      T("Tener $5.000  →  +5", 120, 650, 42, BLUE),
      T("Deber $5.000  →  −5", 120, 730, 42, RED)],
    say:"Lámina uno. Los números enteros son los positivos, los negativos y el cero. En la recta, los positivos van a la derecha del cero y los negativos a la izquierda. Piensen en la plata: tener cinco mil pesos es más cinco; deber cinco mil pesos es menos cinco." },

  { pag:"Lámina 2 de 7", titulo:"Lámina 2 · Suma con el mismo signo", items:[
      T("Mismo signo: se suman y se deja el signo", 100, 215, 42, BLUE),
      T("(+4) + (+6) = +10", 140, 340, 54),
      T("(−5) + (−3) = −8", 140, 460, 54, RED),
      T("Debo 5 y luego debo 3  →  debo 8", 140, 570, 38, GREY)],
    say:"Lámina dos. Suma con el mismo signo. Si los dos tienen el mismo signo, se suman y se deja ese signo. Más cuatro más más seis, más diez. Menos cinco más menos tres: si debo cinco y luego debo tres, en total debo ocho: menos ocho." },

  { pag:"Lámina 3 de 7", titulo:"Lámina 3 · Suma con signos diferentes", items:[
      T("Signos diferentes: se restan", 100, 210, 42, BLUE),
      T("y se deja el signo del que tiene mayor valor absoluto", 100, 265, 34, BLUE),
      T("(−9) + 4 = −5", 140, 390, 54, RED), T("9 − 4 = 5;  gana el −9", 600, 390, 32, GREY),
      T("7 + (−2) = 5", 140, 505, 54, BLUE), T("7 − 2 = 5;  gana el 7", 600, 505, 32, GREY),
      T("Debo 9 y pago 4  →  todavía debo 5", 140, 620, 38, GREY)],
    say:"Lámina tres. Suma con signos diferentes. Si los signos son diferentes, se restan: nueve menos cuatro, cinco. ¿Y el signo? El del número que, sin signo, es más grande. Como el nueve es negativo, la respuesta es menos cinco. Es como deber nueve y pagar cuatro: todavía debo cinco. En el otro: siete menos dos, cinco, y gana el siete, que es positivo." },

  { pag:"Lámina 4 de 7", titulo:"Lámina 4 · La resta", items:[
      T("Restar es sumar el opuesto", 100, 215, 44, BLUE),
      T("3 − (−5) = 3 + 5 = 8", 140, 330, 50),
      T("−6 − 4 = −6 + (−4) = −10", 140, 430, 50),
      T("−2 − (−7) = −2 + 7 = 5", 140, 530, 50),
      T("menos (menos) se vuelve más", 140, 650, 42, RED)],
    say:"Lámina cuatro. La resta. Para restar, cambiamos la resta por suma y le cambiamos el signo al número que se resta. Tres menos menos cinco es tres más cinco: ocho. Menos seis menos cuatro es menos seis más menos cuatro: menos diez. Menos dos menos menos siete es menos dos más siete: cinco. Después aplicamos las reglas de la suma." },

  { pag:"Lámina 5 de 7", titulo:"Lámina 5 · Multiplicación y división", items:[
      T("Ley de los signos (para × y ÷)", 100, 205, 42, BLUE),
      T("(+)(+) = +        (−)(−) = +", 140, 285, 40),
      T("(+)(−) = −        (−)(+) = −", 140, 350, 40),
      T("(−4)(−3) = 12", 140, 460, 46), T("6 · (−2) = −12", 640, 460, 46),
      EQ([{n:"−20", d:"4"}, " = −5"], 140, 590, 46), EQ([{n:"−18", d:"−6"}, " = 3"], 640, 590, 46),
      T("Ojo: solo para multiplicar y dividir, no para sumar", 140, 720, 34, RED)],
    say:"Lámina cinco. Multiplicación y división: la ley de los signos. Signos iguales dan positivo y signos diferentes dan negativo. Menos cuatro por menos tres, doce positivo. Seis por menos dos, menos doce. Menos veinte entre cuatro, menos cinco. Menos dieciocho entre menos seis, tres. Ojo: esta ley es para multiplicar y dividir, no para sumar." },

  { pag:"Lámina 6 de 7", titulo:"Lámina 6 · Operaciones combinadas", items:[
      T("−3 + 2 · (−5) − (−4)", 120, 215, 52),
      T("Orden:  1) paréntesis   2) × y ÷   3) + y −", 120, 295, 34, GREY),
      T("= −3 + (−10) + 4", 120, 400, 50),
      T("2 · (−5) = −10;   − (−4) = + 4", 560, 400, 28, GREY),
      T("= −13 + 4", 120, 500, 50),
      T("= −9", 120, 610, 58, RED)],
    say:"Lámina seis. Operaciones combinadas. Primero se hacen las multiplicaciones y divisiones y después las sumas y restas. Dos por menos cinco, menos diez. Menos menos cuatro se vuelve más cuatro. Queda menos tres, menos diez, más cuatro: menos trece más cuatro, menos nueve." },

  { pag:"Lámina 7 de 7", titulo:"Lámina 7 · Ahora ustedes", items:[
      T("Resuelvan:", 120, 200, 42, BLUE),
      T("a)  (−12) + 7", 140, 290, 46),
      T("b)  −8 − (−15)", 140, 380, 46),
      T("c)  (−6)(−4) ÷ (−3)", 140, 470, 46),
      T("d)  5 − 3 · (−2)", 140, 560, 46)],
    resp:[
      T("= −5", 640, 290, 46, RED),
      T("= −8 + 15 = 7", 640, 380, 46, RED),
      T("= 24 ÷ (−3) = −8", 640, 470, 46, RED),
      T("= 5 + 6 = 11", 640, 560, 46, RED)],
    say:"Lámina siete. Ahora ustedes. Primero: menos doce más siete. Segundo: menos ocho menos menos quince. Tercero: menos seis por menos cuatro, entre menos tres. Cuarto: cinco menos tres por menos dos. Cuando terminen, toquen el botón Ver la respuesta.",
    sayResp:"Revisemos. Primero: signos diferentes, doce menos siete, cinco, y gana el doce: menos cinco. Segundo: menos ocho más quince, siete. Tercero: menos seis por menos cuatro, veinticuatro; entre menos tres, menos ocho. Cuarto: primero la multiplicación, tres por menos dos, menos seis; cinco menos menos seis es cinco más seis, once. ¿Les dio igual? ¡Muy bien!" }
];
const DUDAS = [
  { q:"¿Menos por menos siempre da más?", a:"Solo al multiplicar o dividir. En la suma, (−5) + (−3) da −8.",
    say:"Solo al multiplicar o dividir. En la suma, menos cinco más menos tres da menos ocho." },
  { q:"¿Qué es el valor absoluto?", a:"Es el número sin su signo: el valor absoluto de −9 es 9.", say:"Es el número sin su signo: el valor absoluto de menos nueve es nueve." },
  { q:"¿Por qué 3 − (−5) da 8?", a:"Porque quitar una deuda es como ganar: restar un negativo es sumar. 3 − (−5) = 3 + 5 = 8.",
    say:"Porque quitar una deuda es como ganar: restar un negativo es sumar. Tres menos menos cinco es tres más cinco, ocho." },
  { q:"¿Qué hago primero en una operación combinada?", a:"Paréntesis, luego multiplicaciones y divisiones, y al final sumas y restas, de izquierda a derecha." },
  { q:"¿El cero es positivo o negativo?", a:"Ninguno de los dos; es el punto de partida en la recta." }
];

/* =================== Tablero y mini profe =================== */
const NS = "http://www.w3.org/2000/svg";
const ink = $("ink"), profeG = $("profe");
const el = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); (p || ink).appendChild(e); return e; };
let nodos = [], dibujoId = 0;
function construir(lam){
  ink.innerHTML = ""; nodos = [];
  const todos = [...(lam.base || []).map(x => ({...x, _base:true})), ...lam.items];
  todos.forEach((it, i) => {
    if (it.path){
      const p = el("path", {d:it.path, fill:it.fill || "none", "fill-opacity":0, stroke:it.color, "stroke-width":it.w, "stroke-linecap":"round", "stroke-linejoin":"round"});
      const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
      nodos.push({it, p, L});
    } else if (it.eq){ // ecuación con fracciones desplegadas, se escribe de izquierda a derecha
      const cp = el("clipPath", {id:"c" + i});
      const r = el("rect", {x:it.x - 4, y:it.y - it.size * 1.5, width:0, height:it.size * 2.5}, cp);
      const g = el("g", {"clip-path":`url(#c${i})`});
      const at = {"font-family":"Kalam, cursive", fill:it.color};
      let X = it.x;
      it.eq.forEach(sg => {
        if (typeof sg === "string"){ const t = el("text", {...at, x:X, y:it.y, "font-size":it.size, "xml:space":"preserve"}, g); t.textContent = sg; X += t.getComputedTextLength(); }
        else { const fs = it.size * .82; X += it.size * .25;
          const tn = el("text", {...at, y:it.y - it.size * .55, "font-size":fs, "text-anchor":"middle"}, g); tn.textContent = sg.n;
          const td = el("text", {...at, y:it.y + it.size * .62, "font-size":fs, "text-anchor":"middle"}, g); td.textContent = sg.d;

const SH = {x:-70, y:494}, L1 = 175, L2 = 165, REPOSO = 1430;
