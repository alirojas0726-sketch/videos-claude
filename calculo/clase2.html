<script>
const $ = id => document.getElementById(id);
const BLUE="#1f5fbf", GREEN="#1d8a4e", RED="#c62f2f", DARK="#1d2733", GREY="#6b7785", ORANGE="#c36a12";
const F_AZ="rgba(31,95,191,.14)", F_VE="rgba(29,138,78,.16)", F_NA="rgba(214,130,30,.18)", F_RO="rgba(198,47,47,.10)";
/* Piezas comunes de las láminas: texto, trazo, ecuación con fracción y plano cartesiano */
const T = (text, x, y, size, color) => ({text, x, y, size, color:color || DARK});
const PA = (path, color, w, fill) => ({path, color, w, fill});
const EQ = (eq, x, y, size, color) => ({eq, x, y, size, color:color || DARK});
const menos = n => String(n).replace("-", "−");
/* Plano: o = {ox, oy, u, x0, x1, y0, y1}. Devuelve la cuadrícula, los ejes y los números (van en "base": aparecen de una). */
function plano(o){
  const {ox, oy, u, x0, x1, y0, y1} = o, X = x => ox + x * u, Y = y => oy - y * u, out = [];
  let g = "";
  for (let x = x0; x <= x1; x++) g += `M${X(x)} ${Y(y1)} L${X(x)} ${Y(y0)} `;
  for (let y = y0; y <= y1; y++) g += `M${X(x0)} ${Y(y)} L${X(x1)} ${Y(y)} `;
  out.push(PA(g, "#d3dbe5", 1.5));
  const xa = X(x1) + 26, ya = Y(y1) - 26;
  out.push(PA(`M${X(x0) - 14} ${oy} L${xa} ${oy} M${xa} ${oy} l-14 -8 M${xa} ${oy} l-14 8 M${ox} ${Y(y0) + 14} L${ox} ${ya} M${ox} ${ya} l-8 14 M${ox} ${ya} l8 14`, DARK, 3));
  for (let x = x0; x <= x1; x++) if (x) out.push(T(menos(x), X(x) - (x < 0 ? 12 : 5), oy + 24, 19, GREY));
  for (let y = y0; y <= y1; y++) if (y) out.push(T(menos(y), ox - (y < 0 ? 32 : 22), Y(y) + 7, 19, GREY));
  out.push(T("0", ox - 20, oy + 24, 19, GREY), T("x", xa - 4, oy - 14, 28), T("y", ox + 14, ya + 8, 28));
  return out;
}
const PX = (o, x) => o.ox + x * o.u, PY = (o, y) => o.oy - y * o.u;
function punto(o, x, y, color, r){ r = r || 8; const cx = PX(o, x), cy = PY(o, y);
  return PA(`M${cx - r} ${cy} a${r} ${r} 0 1 0 ${2 * r} 0 a${r} ${r} 0 1 0 ${-2 * r} 0`, color, 3, color); }
/* Curva y = f(x) entre xa y xb; con flechas en las puntas si "flechas" */
function curva(o, f, xa, xb, color, w, flechas){
  const n = 60, pts = [];
  for (let i = 0; i <= n; i++){ const x = xa + (xb - xa) * i / n; pts.push([PX(o, x), PY(o, f(x))]); }
  let d = "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
  if (flechas){
    const cab = (a, b) => { const ang = Math.atan2(a[1] - b[1], a[0] - b[0]), L = 18;
      return [0.45, -0.45].map(s => `M${a[0].toFixed(1)} ${a[1].toFixed(1)} l${(-L * Math.cos(ang + s)).toFixed(1)} ${(-L * Math.sin(ang + s)).toFixed(1)}`).join(" "); };
    d += " " + cab(pts[n], pts[n - 1]) + " " + cab(pts[0], pts[1]);
  }
  return PA(d, color, w || 5);
}
/* Línea punteada entre dos puntos del plano */
function punteada(o, xa, ya, xb, yb, color){
  const A = [PX(o, xa), PY(o, ya)], B = [PX(o, xb), PY(o, yb)], L = Math.hypot(B[0] - A[0], B[1] - A[1]), n = Math.max(1, Math.floor(L / 22));
  let d = ""; for (let i = 0; i < n; i++){ const t0 = i / n, t1 = Math.min(1, (i + .55) / n);
    d += `M${(A[0] + (B[0] - A[0]) * t0).toFixed(1)} ${(A[1] + (B[1] - A[1]) * t0).toFixed(1)} L${(A[0] + (B[0] - A[0]) * t1).toFixed(1)} ${(A[1] + (B[1] - A[1]) * t1).toFixed(1)} `; }
  return PA(d, color || GREY, 3);
}
/* lím con "x→a" debajo; resto: texto o arreglo de ecuación (con fracciones) */
function LIM(x, y, s, a, resto, color){
  const c = color || DARK, out = [T("lím", x, y, s, c), T("x→" + a, x - 4, y + s * .62, s * .46, c)];
  out.push(typeof resto === "string" ? T(resto, x + s * 1.75, y, s, c) : EQ(resto, x + s * 1.6, y, s, c));
  return out;
}
/* Signo de integral dibujado, con límites a (abajo) y b (arriba) si se dan */
function INTEG(x, y, s, a, b, color){
  const c = color || DARK, f = v => v.toFixed(1);
  const out = [PA(`M${f(x + .62 * s)} ${f(y - .82 * s)} C${f(x + .48 * s)} ${f(y - 1.08 * s)} ${f(x + .3 * s)} ${f(y - .85 * s)} ${f(x + .31 * s)} ${f(y - .3 * s)} L${f(x + .27 * s)} ${f(y + .35 * s)} C${f(x + .26 * s)} ${f(y + .78 * s)} ${f(x + .08 * s)} ${f(y + .78 * s)} ${f(x)} ${f(y + .55 * s)}`, c, Math.max(3, s / 14))];
  if (b != null) out.push(T(String(b), x + .66 * s, y - .62 * s, s * .45, c));
  if (a != null) out.push(T(String(a), x + .36 * s, y + .72 * s, s * .45, c));
  return out;
}

// TITULO: Derivadas de polinomios
// TRATO: tu
const OD = {ox:350, oy:620, u:60, x0:-3, x1:4, y0:-2, y1:6};
const O6 = {ox:930, oy:560, u:45, x0:-1, x1:6, y0:-4, y1:4};
const LAMINAS = [
  { pag:"Inicio", titulo:"Derivadas de polinomios", items:[
      T("Matemáticas · grado 11", 120, 250, 44, BLUE),
      T("y = xⁿ   →   y′ = n · xⁿ⁻¹", 120, 390, 52),
      T("y = 3x⁴ − 5x² + 7x − 9   →   y′ = 12x³ − 10x + 7", 120, 500, 36),
      T("Regla de la potencia · pendiente en un punto", 120, 640, 34, GREY)],
    say:"¡Hola! Soy el profe Alirio. En esta clase vamos a aprender a derivar polinomios con la regla de la potencia, y a usar la derivada para hallar la pendiente en un punto. Ten listo el cuaderno." },

  { pag:"Lámina 1 de 6", titulo:"Lámina 1 · Constante y x sola", items:[
      T("y = 7   →   y′ = 0", 140, 260, 54), T("un número solo no cambia", 640, 260, 30, GREY),
      T("y = x   →   y′ = 1", 140, 400, 54),
      T("y = 5x   →   y′ = 5", 140, 540, 54), T("queda el número que acompaña a x", 640, 540, 30, GREY)],
    say:"Lámina uno. La derivada de un número solo es cero, porque un número no cambia. La derivada de equis es uno. Y la derivada de cinco equis es cinco: el número que acompaña a la equis." },

  { pag:"Lámina 2 de 6", titulo:"Lámina 2 · Regla de la potencia", items:[
      T("y = xⁿ   →   y′ = n · xⁿ⁻¹", 120, 250, 58, BLUE),
      T("El exponente baja a multiplicar y se le resta 1", 120, 340, 34, GREY),
      T("y = x³   →   y′ = 3x²", 160, 480, 52, RED),
      T("y = x⁵   →   y′ = 5x⁴", 160, 610, 52, RED)],
    say:"Lámina dos. La regla de la potencia, la más importante. El exponente baja a multiplicar y al exponente se le resta uno. Equis al cubo: baja el tres, queda tres equis al cuadrado. Equis a la quinta: cinco equis a la cuarta." },

  { pag:"Lámina 3 de 6", titulo:"Lámina 3 · Número por potencia", items:[
      T("y = 4x³", 140, 250, 52), T("→   y′ = 4 · 3x² = 12x²", 400, 250, 48, RED),
      T("y = −2x⁵", 140, 410, 52), T("→   y′ = −2 · 5x⁴ = −10x⁴", 400, 410, 48, RED),
      T("El número de adelante se queda", 140, 560, 38, BLUE),
      T("y se multiplica por el exponente que baja", 140, 615, 38, BLUE)],
    say:"Lámina tres. Si la potencia tiene un número adelante, ese número se queda y se multiplica por el exponente que baja. Cuatro por tres, doce, y equis queda al cuadrado. Menos dos por cinco, menos diez, y equis queda a la cuarta." },

  { pag:"Lámina 4 de 6", titulo:"Lámina 4 · Un polinomio completo", items:[
      T("y = 3x⁴ − 5x² + 7x − 9", 120, 220, 52),
      T("3x⁴  →  12x³", 160, 320, 40, BLUE),
      T("−5x²  →  −10x", 160, 390, 40, BLUE),
      T("7x  →  7", 160, 460, 40, BLUE),
      T("−9  →  0  (desaparece)", 160, 530, 40, GREY),
      T("y′ = 12x³ − 10x + 7", 120, 650, 58, RED)],
    say:"Lámina cuatro. Un polinomio se deriva término por término. Tres equis a la cuarta: doce equis al cubo. Menos cinco equis al cuadrado: menos diez equis. Siete equis: siete. Y menos nueve, que es un número solo, se vuelve cero y desaparece." },

  { pag:"Lámina 5 de 6", titulo:"Lámina 5 · La pendiente en un punto", base:plano(O6), items:[
      T("y = x² − 4x + 1", 120, 230, 46),
      T("y′ = 2x − 4", 120, 320, 46, BLUE),
      T("Si x = 3  →  y′ = 2(3) − 4 = 2", 120, 430, 40, RED),
      T("En x = 3 la pendiente", 120, 540, 36),
      T("de la tangente es 2", 120, 590, 36),
      curva(O6, x => x * x - 4 * x + 1, -0.2, 4.6, BLUE, 4),
      punto(O6, 3, -2, RED, 8),
      curva(O6, x => 2 * x - 8, 2.2, 4.6, RED, 4, true)],
    say:"Lámina cinco. Primero derivamos ye igual a equis al cuadrado menos cuatro equis más uno: ye prima es dos equis menos cuatro. Para saber la pendiente en un punto, reemplazamos en la derivada. Si equis es tres: dos por tres, seis, menos cuatro, dos. En ese punto la curva sube con pendiente dos." },

  { pag:"Lámina 6 de 6", titulo:"Lámina 6 · Ahora tú", items:[
      T("a)  Deriva  y = 6x³ − 2x² + x − 8", 120, 230, 44),
      T("b)  Deriva  y = x⁴ + 3x² − 5x", 120, 330, 44),
      T("y halla la pendiente en x = 1", 175, 395, 40)],
    resp:[
      T("a)  y′ = 18x² − 4x + 1", 120, 520, 46, RED),
      T("b)  y′ = 4x³ + 6x − 5", 120, 610, 46, RED),
      T("Si x = 1  →  y′ = 4 + 6 − 5 = 5", 175, 690, 40, RED)],
    say:"Lámina seis. Ahora tú. Primero: deriva ye igual a seis equis al cubo, menos dos equis al cuadrado, más equis, menos ocho. Segundo: deriva ye igual a equis a la cuarta, más tres equis al cuadrado, menos cinco equis, y halla la pendiente en equis igual a uno. Cuando termines, toca el botón Ver la respuesta.",
    sayResp:"Revisemos. Primero: seis por tres, dieciocho equis al cuadrado; menos dos por dos, menos cuatro equis; equis da uno; y menos ocho desaparece. Segundo: cuatro equis al cubo, más seis equis, menos cinco. Si equis es uno: cuatro más seis menos cinco, cinco. ¿Te dio igual? ¡Muy bien!" }
];
const DUDAS = [
  { q:"¿Por qué la derivada de un número da 0?", a:"Porque un número no cambia, y la derivada mide el cambio.", say:"Porque un número no cambia, y la derivada mide el cambio." },
  { q:"¿Por qué la derivada de 7x es 7?", a:"Porque 7x es 7x¹: baja el 1, queda 7x⁰, y x⁰ = 1.", say:"Porque siete equis es siete equis a la uno: baja el uno, queda siete equis a la cero, y equis a la cero es uno." },
  { q:"¿El exponente siempre baja y se le resta 1?", a:"Sí, en cada potencia de x." },
  { q:"¿y′ y dy/dx son lo mismo?", a:"Sí, son dos formas de escribir la derivada.", say:"Sí. Ye prima y de ye sobre de equis son dos formas de escribir la derivada." }
];

/* =================== Tablero y mini profe =================== */
const NS = "http://www.w3.org/2000/svg";
const ink = $("ink"), profeG = $("profe");
const el = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); (p || ink).appendChild(e); return e; };
let nodos = [], dibujoId = 0;
function construir(lam){
  ink.innerHTML = ""; nodos = [];
  const todos = [...(lam.base || []).map(x => ({...x, _base:true})), ...lam.items];
  todos.forEach((it, i) => {
    if (it.path){
      const p = el("path", {d:it.path, fill:it.fill || "none", "fill-opacity":0, stroke:it.color, "stroke-width":it.w, "stroke-linecap":"round", "stroke-linejoin":"round"});
      const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
      nodos.push({it, p, L});
    } else if (it.eq){ // ecuación con fracciones desplegadas, se escribe de izquierda a derecha
      const cp = el("clipPath", {id:"c" + i});
      const r = el("rect", {x:it.x - 4, y:it.y - it.size * 1.5, width:0, height:it.size * 2.5}, cp);
      const g = el("g", {"clip-path":`url(#c${i})`});
      const at = {"font-family":"Kalam, cursive", fill:it.color};
