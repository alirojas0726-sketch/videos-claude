<script>
const $ = id => document.getElementById(id);
const BLUE="#1f5fbf", GREEN="#1d8a4e", RED="#c62f2f", DARK="#1d2733", GREY="#6b7785", ORANGE="#c36a12";
const F_AZ="rgba(31,95,191,.14)", F_VE="rgba(29,138,78,.16)", F_NA="rgba(214,130,30,.18)", F_RO="rgba(198,47,47,.10)";
/* Piezas comunes de las láminas: texto, trazo, ecuación con fracción y plano cartesiano */
const T = (text, x, y, size, color) => ({text, x, y, size, color:color || DARK});
const PA = (path, color, w, fill) => ({path, color, w, fill});
const EQ = (eq, x, y, size, color) => ({eq, x, y, size, color:color || DARK});
const menos = n => String(n).replace("-", "−");
/* Plano: o = {ox, oy, u, x0, x1, y0, y1}. Devuelve la cuadrícula, los ejes y los números (van en "base": aparecen de una). */
function plano(o){
  const {ox, oy, u, x0, x1, y0, y1} = o, X = x => ox + x * u, Y = y => oy - y * u, out = [];
  let g = "";
  for (let x = x0; x <= x1; x++) g += `M${X(x)} ${Y(y1)} L${X(x)} ${Y(y0)} `;
  for (let y = y0; y <= y1; y++) g += `M${X(x0)} ${Y(y)} L${X(x1)} ${Y(y)} `;
  out.push(PA(g, "#d3dbe5", 1.5));
  const xa = X(x1) + 26, ya = Y(y1) - 26;
  out.push(PA(`M${X(x0) - 14} ${oy} L${xa} ${oy} M${xa} ${oy} l-14 -8 M${xa} ${oy} l-14 8 M${ox} ${Y(y0) + 14} L${ox} ${ya} M${ox} ${ya} l-8 14 M${ox} ${ya} l8 14`, DARK, 3));
  for (let x = x0; x <= x1; x++) if (x) out.push(T(menos(x), X(x) - (x < 0 ? 12 : 5), oy + 24, 19, GREY));
  for (let y = y0; y <= y1; y++) if (y) out.push(T(menos(y), ox - (y < 0 ? 32 : 22), Y(y) + 7, 19, GREY));
  out.push(T("0", ox - 20, oy + 24, 19, GREY), T("x", xa - 4, oy - 14, 28), T("y", ox + 14, ya + 8, 28));
  return out;
}
const PX = (o, x) => o.ox + x * o.u, PY = (o, y) => o.oy - y * o.u;
function punto(o, x, y, color, r){ r = r || 8; const cx = PX(o, x), cy = PY(o, y);
  return PA(`M${cx - r} ${cy} a${r} ${r} 0 1 0 ${2 * r} 0 a${r} ${r} 0 1 0 ${-2 * r} 0`, color, 3, color); }
/* Curva y = f(x) entre xa y xb; con flechas en las puntas si "flechas" */
function curva(o, f, xa, xb, color, w, flechas){
  const n = 60, pts = [];
  for (let i = 0; i <= n; i++){ const x = xa + (xb - xa) * i / n; pts.push([PX(o, x), PY(o, f(x))]); }
  let d = "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
  if (flechas){
    const cab = (a, b) => { const ang = Math.atan2(a[1] - b[1], a[0] - b[0]), L = 18;
      return [0.45, -0.45].map(s => `M${a[0].toFixed(1)} ${a[1].toFixed(1)} l${(-L * Math.cos(ang + s)).toFixed(1)} ${(-L * Math.sin(ang + s)).toFixed(1)}`).join(" "); };
    d += " " + cab(pts[n], pts[n - 1]) + " " + cab(pts[0], pts[1]);
  }
  return PA(d, color, w || 5);
}
/* Línea punteada entre dos puntos del plano */
function punteada(o, xa, ya, xb, yb, color){
  const A = [PX(o, xa), PY(o, ya)], B = [PX(o, xb), PY(o, yb)], L = Math.hypot(B[0] - A[0], B[1] - A[1]), n = Math.max(1, Math.floor(L / 22));
  let d = ""; for (let i = 0; i < n; i++){ const t0 = i / n, t1 = Math.min(1, (i + .55) / n);
    d += `M${(A[0] + (B[0] - A[0]) * t0).toFixed(1)} ${(A[1] + (B[1] - A[1]) * t0).toFixed(1)} L${(A[0] + (B[0] - A[0]) * t1).toFixed(1)} ${(A[1] + (B[1] - A[1]) * t1).toFixed(1)} `; }
  return PA(d, color || GREY, 3);
}

// TITULO: Competencia 1: Interpretación y representación
function rectaOctavos(){
  let d = "M150 380 L1150 380 ";
  for (let i = 0; i <= 8; i++) d += `M${150 + i * 125} 362 L${150 + i * 125} 398 `;
  const out = [PA(d, DARK, 3), T("0", 142, 440, 34), T("1", 1144, 440, 34)];
  for (let i = 1; i < 8; i++) out.push(T(String(i), 145 + i * 125, 432, 22, GREY));
  return out;
}
const circ = (cx, cy, r, color) => PA(`M${cx - r} ${cy} a${r} ${r} 0 1 0 ${2 * r} 0 a${r} ${r} 0 1 0 ${-2 * r} 0`, color, 3, color);
function barras(){
  const out = [PA("M730 280 L730 700 L1290 700", DARK, 3)];
  [2, 4, 6, 8].forEach(k => { out.push(PA(`M722 ${700 - k * 50} L738 ${700 - k * 50}`, DARK, 2)); out.push(T(String(k), 698, 708 - k * 50, 22, GREY)); });
  return out;
}
const DEP = [["Fútbol", 8, F_AZ], ["Baloncesto", 5, F_VE], ["Voleibol", 4, F_NA], ["Patinaje", 3, F_RO]];
const LAMINAS = [
  { pag:"Inicio", titulo:"Competencia 1: Interpretación y representación", items:[
      T("Nivelación · Matemáticas 6-1", 120, 250, 44, BLUE),
      T("Interpretación y representación", 120, 380, 50),
      T("Ejercicios 1 al 5 del taller", 120, 480, 40),
      T("Planteamiento · desarrollo · respuesta", 120, 600, 34, GREY)],
    say:"¡Hola, muchachos! Soy el profe Alirio. En esta clase vamos a resolver, paso a paso, los ejercicios uno al cinco del taller de nivelación: la competencia de interpretación y representación. Tengan el taller y el cuaderno a la mano." },

  { pag:"Lámina 1 de 6", titulo:"Lámina 1 · Ejercicio 1: leer y descomponer", items:[
      PA("M140 260 L820 260 M253 200 L253 335 M366 200 L366 335 M479 200 L479 335 M592 200 L592 335 M705 200 L705 335", GREY, 2),
      ...["CM", "DM", "UM", "C", "D", "U"].map((t, i) => T(t, 172 + i * 113, 240, 30, GREY)),
      ...["4", "0", "5", "3", "6", "0"].map((t, i) => T(t, 180 + i * 113, 315, 50, i % 3 === 0 ? BLUE : DARK)),
      T("En letras:  cuatrocientos cinco mil trescientos sesenta", 120, 440, 34, BLUE),
      T("Forma desarrollada:", 120, 540, 38),
      T("400.000 + 5.000 + 300 + 60", 120, 625, 50, RED),
      T("Los ceros no se escriben en la suma", 120, 715, 30, GREY)],
    say:"Lámina uno. Ejercicio uno. Para leer un número grande lo separamos por el punto: a la izquierda los miles y a la derecha las unidades. Cuatrocientos cinco mil, trescientos sesenta. Para la forma desarrollada, cada cifra vale según su posición: el cuatro está en las centenas de mil y vale cuatrocientos mil; el cinco, en las unidades de mil, vale cinco mil; el tres vale trescientos y el seis vale sesenta. Los ceros no se escriben en la suma." },

  { pag:"Lámina 2 de 6", titulo:"Lámina 2 · Ejercicio 2: fracciones en la recta", items:[
      ...rectaOctavos(),
      circ(525, 380, 11, RED), EQ([{n:"3", d:"8"}], 500, 300, 38, RED),
      circ(900, 380, 11, BLUE), EQ([{n:"3", d:"4"}], 875, 300, 38, BLUE),
      T("Cada parte vale", 120, 560, 36), EQ([{n:"1", d:"8"}], 400, 560, 36),
      T("3/8 → tercera marca", 600, 560, 36, RED),
      EQ([{n:"3", d:"4"}, " = ", {n:"3 × 2", d:"4 × 2"}, " = ", {n:"6", d:"8"}, "  →  sexta marca"], 120, 700, 38, BLUE)],
    say:"Lámina dos. Ejercicio dos. Dividimos el segmento de cero a uno en ocho partes iguales; cada parte es un octavo. Tres octavos queda en la tercera marca. Para tres cuartos, lo convertimos a octavos: multiplicamos arriba y abajo por dos y queda seis octavos. Va en la sexta marca." },

  { pag:"Lámina 3 de 6", titulo:"Lámina 3 · Ejercicio 3: fracción y simplificar", items:[
      T("Planteamiento:", 120, 230, 34, BLUE), EQ(["fracción = ", {n:"fútbol", d:"total"}, " = ", {n:"12", d:"20"}], 380, 230, 40),
      T("Desarrollo:", 120, 400, 34, BLUE), EQ([{n:"12 ÷ 4", d:"20 ÷ 4"}, " = ", {n:"3", d:"5"}], 380, 400, 42),
      T("Respuesta:", 120, 570, 34, BLUE), EQ([{n:"3", d:"5"}, " del curso practica fútbol"], 380, 570, 42, RED)],
    say:"Lámina tres. Ejercicio tres. La fracción es la parte sobre el total: doce estudiantes de veinte, doce veinteavos. Para simplificar buscamos un número que divida a los dos; el mayor es cuatro. Doce entre cuatro, tres; veinte entre cuatro, cinco. Quedan tres quintos del curso, y ya no se puede simplificar más." },

  { pag:"Lámina 4 de 6", titulo:"Lámina 4 · Ejercicio 4: fracción a decimal y ordenar", items:[
      EQ([{n:"3", d:"4"}, " = 3 ÷ 4 = 0,75"], 120, 240, 46),
      EQ([{n:"7", d:"10"}, " = 7 ÷ 10 = 0,7"], 120, 380, 46),
      T("Igualar cifras:   0,70     0,75     0,65", 120, 490, 40),
      T("65 < 70 < 75", 170, 560, 38, GREY),
      T("Orden:  0,65 < 0,7 < 0,75", 120, 670, 50, RED)],
    say:"Lámina cuatro. Ejercicio cuatro. Para pasar una fracción a decimal se divide el numerador entre el denominador. Tres entre cuatro, cero coma setenta y cinco. Siete entre diez, cero coma siete. Para ordenar decimales les ponemos la misma cantidad de cifras: cero coma siete es lo mismo que cero coma setenta. Comparamos sesenta y cinco, setenta y setenta y cinco, y queda: cero coma sesenta y cinco, cero coma siete y cero coma setenta y cinco." },

  { pag:"Lámina 5 de 6", titulo:"Lámina 5 · Ejercicio 5: tabla y diagrama de barras", base:barras(), items:[
      T("a)  Cualitativa", 110, 240, 40, BLUE), T("es una cualidad, no un número", 140, 290, 28, GREY),
      EQ(["b)  Fútbol: ", {n:"8", d:"20"}, " = ", {n:"2", d:"5"}], 110, 420, 40, RED),
      T("c)  Diagrama de barras", 110, 560, 38, BLUE), T("con título y ejes rotulados", 140, 610, 28, GREY),
      T("Deporte favorito", 820, 250, 32),
      ...DEP.flatMap(([n, v, f], i) => [PA(`M${760 + i * 130} 700 L${760 + i * 130} ${700 - v * 50} L${840 + i * 130} ${700 - v * 50} L${840 + i * 130} 700 Z`, GREY, 2, f),
        T(String(v), 790 + i * 130, 688 - v * 50, 26), T(n, 755 + i * 130 - (n.length > 8 ? 12 : 0), 735, 20, GREY)])],
    say:"Lámina cinco. Ejercicio cinco. Una variable es cualitativa cuando su respuesta es una palabra, como un deporte o un color, y cuantitativa cuando es un número; el deporte favorito es cualitativa. Al fútbol lo prefieren ocho de veinte: ocho veinteavos, que simplificado entre cuatro es dos quintos. Para el diagrama: en el eje horizontal van los deportes, en el vertical la cantidad de estudiantes, y cada barra sube hasta su número: ocho, cinco, cuatro y tres. No olviden el título." },

  { pag:"Lámina 6 de 6", titulo:"Lámina 6 · Ahora ustedes", items:[
      T("a)  Escriban en letras y en forma desarrollada:  702.450", 100, 215, 32),
      T("b)  En un curso de 25 estudiantes, 15 usan bicicleta.", 100, 290, 32),
      T("¿Qué fracción usa bicicleta? Simplifíquenla.", 140, 335, 32),
      T("c)  Escriban 2/5 como decimal y ordenen de menor a mayor:", 100, 410, 32),
      T("0,4;  0,45  y  0,38", 140, 455, 32)],
    resp:[
      T("a)  Setecientos dos mil cuatrocientos cincuenta", 100, 560, 32, RED),
      T("700.000 + 2.000 + 400 + 50", 140, 610, 34, RED),
      EQ(["b)  ", {n:"15", d:"25"}, " = ", {n:"3", d:"5"}], 100, 720, 34, RED),
      T("c)  2/5 = 0,4  →  0,38 < 0,4 < 0,45", 560, 720, 34, RED)],
    say:"Lámina seis. Ahora ustedes. Primero: escriban en letras y en forma desarrollada el número setecientos dos mil cuatrocientos cincuenta. Segundo: en un curso de veinticinco estudiantes, quince usan bicicleta; ¿qué fracción usa bicicleta? Simplifíquenla. Tercero: escriban dos quintos como decimal y ordenen de menor a mayor cero coma cuatro, cero coma cuarenta y cinco y cero coma treinta y ocho. Cuando terminen, toquen el botón Ver la respuesta.",
    sayResp:"Revisemos. Primero: setecientos dos mil cuatrocientos cincuenta; en forma desarrollada, setecientos mil, más dos mil, más cuatrocientos, más cincuenta. Segundo: quince veinticincoavos, que simplificado entre cinco es tres quintos. Tercero: dos quintos es cero coma cuatro, y el orden es cero coma treinta y ocho, cero coma cuatro y cero coma cuarenta y cinco. ¿Les dio igual? ¡Muy bien!" }
];
const DUDAS = [
  { q:"¿Por qué los ceros no van en la forma desarrollada?", a:"Porque valen cero: no suman nada." },
  { q:"¿Cómo sé que una fracción ya está simplificada?", a:"Cuando ningún número, aparte del 1, divide al numerador y al denominador a la vez." },
  { q:"¿0,7 y 0,70 son iguales?", a:"Sí: agregar ceros a la derecha de un decimal no cambia su valor.", say:"Sí. Agregar ceros a la derecha de un decimal no cambia su valor: cero coma siete es igual a cero coma setenta." },
  { q:"¿La edad es cualitativa o cuantitativa?", a:"Cuantitativa, porque se responde con un número." }

const SH = {x:-70, y:494}, L1 = 175, L2 = 165, REPOSO = 1430;
let cx = REPOSO, paso = 0;
function pose(tip, escribiendo){

  const hx = escribiendo ? tip.x - cx + 20 : -86, hy = escribiendo ? tip.y + 26 : 684;
  const dx = hx - SH.x, dy = hy - SH.y;
  const d = Math.min(Math.max(Math.hypot(dx, dy), Math.abs(L1 - L2) + 2), L1 + L2 - 2);
  const a = Math.atan2(dy, dx), th = Math.acos((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d));

  set(P.hand, {cx:fx, cy:fy}); set(P.thumb, {cx:fx - uy / ul * 12, cy:fy + ux / ul * 12});

const sinMov = matchMedia("(prefers-reduced-motion: reduce)").matches;
function mostrarLamina(k, animar, alTerminar){
  const lam = typeof k === "object" ? k : LAMINAS[k]; const id = ++dibujoId;
  $("titulo").textContent = lam.titulo; $("pag").textContent = lam.pag;
  construir(lam);

  base.forEach(n => prog(n, 1));

  resto.forEach(n => prog(n, 0));

/* =================== La clase (cada estudiante a su ritmo) =================== */
let k = 0, vozOn = true, voces = [];
const hayVoz = "speechSynthesis" in window;
/* Voces del celular: se prefiere una voz de hombre en español; el estudiante puede escoger otra en "Voz". */
const HOMBRES = /(raul|raúl|pablo|jorge|diego|juan|carlos|enrique|alvaro|álvaro|gonzalo|andres|andrés|tomas|tomás|jose|josé|miguel|gerardo|jaime|dario|darío|emilio|federico|hugo|alonso|lorenzo|salvador|gabriel|\bmale\b|hombre|masculin)/i;
const MUJERES = /(female|mujer|femenin|paulina|monica|mónica|helena|laura|sabina|elvira|dalia|salome|salomé|paloma|marisol|lucia|lucía|soledad|angelica|angélica|isabel|francisca|ximena|catalina|camila|valentina|esperanza|elena|ines|inés)/i;
let vozElegida = "";
try { vozElegida = localStorage.getItem("niv_voz") || ""; } catch (e) {}
function puntos(v){ const l = v.lang.replace("_", "-"); let p = 0;
  if (HOMBRES.test(v.name)) p += 100; if (MUJERES.test(v.name)) p -= 100;
  p += {"es-CO":8, "es-MX":7, "es-US":6, "es-419":5, "es-ES":3}[l] || 1; if (/natural|online|neural|enhanced|premium/i.test(v.name)) p += 2; return p; }
function cargarVoces(){
  try { voces = speechSynthesis.getVoices().filter(v => /^es/i.test(v.lang)).sort((x, y) => puntos(y) - puntos(x)); } catch (e) { voces = []; }
  const sel = $("elegirVoz"); if (!sel) return;
  sel.innerHTML = voces.map(v => `<option value="${v.name.replace(/"/g, "&quot;")}">${v.name.replace(/</g, "&lt;")}${HOMBRES.test(v.name) ? " (hombre)" : ""}</option>`).join("");
  if (vozElegida && voces.some(v => v.name === vozElegida)) sel.value = vozElegida;
  $("cajaVoz").hidden = voces.length < 2;
}
function vozEs(){ return voces.find(v => v.name === vozElegida) || voces[0] || null; }
if (hayVoz){ cargarVoces(); try { speechSynthesis.onvoiceschanged = cargarVoces; } catch (e) {} setTimeout(cargarVoces, 800); }
function hablar(texto){
  if (!hayVoz) return;

}
function ajustarSubrayado(){ try { const w = $("titulo").getComputedTextLength(); $("subraya").setAttribute("x2", 80 + Math.min(w, 1200)); } catch (e) {} }

$("listaDudas").innerHTML = DUDAS.map((d, i) => `<button type="button" data-i="${i}" aria-pressed="false">${d.q}</button>`).join("");

const SALON = /[?&]salon\b/.test(location.search);
